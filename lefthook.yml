# Format, lint, and apply safe code fixes before committing
# https://biomejs.dev/recipes/git-hooks/#lefthook
pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --colors=off {staged_files}
      stage_fixed: true
